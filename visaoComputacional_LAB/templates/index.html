<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Vision | AI Operations</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/styles.css">
</head>

<body>
    <style>
        /* Variáveis de Cores e Estilos */
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --error-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        h1 span {
            color: var(--accent-color);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* Área de Upload */
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .upload-area {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            background: #0f172a50;
        }

        .upload-area:hover {
            border-color: var(--accent-color);
            background: var(--bg-card);
        }

        .upload-area input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        #preview {
            max-width: 100%;
            border-radius: 8px;
            display: none;
            border: 1px solid var(--border-color);
        }

        /* Botões */
        .btn {
            background: var(--accent-hover);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Painel de Resultados */
        .results-panel {
            background: var(--bg-main);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .results-panel h3 {
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge {
            background: #1e3a8a30;
            border: 1px solid #3b82f650;
            color: #93c5fd;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .badge .conf {
            background: #1e3a8a;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #bfdbfe;
        }

        /* Animações */
        .loader {
            display: none;
            color: var(--accent-color);
            font-size: 0.95rem;
            font-weight: 500;
            animation: pulse 1.5s infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }
    </style>

    <main class="dashboard">
        <header>
            <h1>☁️ Azure <span>Vision API</span></h1>
            <p class="subtitle">Módulo de Extração de Metadados e Classificação de Ativos</p>
        </header>

        <div class="grid">
            <section class="upload-section">
                <div class="upload-area" id="drop-zone">
                    <input type="file" id="fotoInput" accept="image/*">
                    <h3>📁 Selecionar Arquivo</h3>
                    <p>Arraste uma evidência ou clique para procurar (JPG, PNG)</p>
                </div>

                <img id="preview" alt="Preview da Imagem">

                <button class="btn" id="btnAnalisar">Analisar Imagem</button>
            </section>

            <section class="results-panel">
                <h3>Resultados da IA</h3>
                <div id="loader" class="loader">Processando no Data Center...</div>

                <div id="resultados" class="tags-container">
                    <p class="placeholder-text">Aguardando submissão de arquivo...</p>
                </div>
            </section>
        </div>
    </main>

    <script>// Seleção de Elementos
        const fotoInput = document.getElementById('fotoInput');
        const btnAnalisar = document.getElementById('btnAnalisar');
        const previewImg = document.getElementById('preview');
        const divResultados = document.getElementById('resultados');
        const loader = document.getElementById('loader');

        // Endpoint da API
        const API_URL = "http://127.0.0.1:8000/analisar";

        /**
         * Monitora a seleção de arquivo para exibir o preview
         */
        fotoInput.addEventListener('change', function () {
            if (this.files && this.files[0]) {
                const leitor = new FileReader();

                leitor.onload = function (e) {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                };

                leitor.readAsDataURL(this.files[0]);

                // Limpa resultados anteriores ao trocar a imagem
                divResultados.innerHTML = "";
            }
        });

        /**
         * Função principal de análise
         */
        async function enviarParaAPI() {
            if (fotoInput.files.length === 0) {
                alert("Operação negada: Nenhum arquivo selecionado.");
                return;
            }

            // Configuração da Interface
            divResultados.innerHTML = "";
            loader.style.display = "block";

            const formData = new FormData();
            formData.append("arquivo", fotoInput.files[0]);

            try {
                const resposta = await fetch(API_URL, {
                    method: "POST",
                    body: formData
                });

                const json = await resposta.json();
                loader.style.display = "none";

                renderizarResultados(json);

            } catch (erro) {
                loader.style.display = "none";
                divResultados.innerHTML = `<p style="color: #ef4444;">Erro de Conexão: O servidor FastAPI está ligado no terminal?</p>`;
                console.error("Erro na requisição:", erro);
            }
        }

        /**
         * Renderiza os badges de resultados na tela
         */
        function renderizarResultados(json) {
            if (json.sucesso && json.dados.length > 0) {
                const htmlContent = json.dados.map(tag => `
            <div class="badge">
                ${tag.nome} <span class="conf">${tag.confianca}%</span>
            </div>
        `).join('');

                divResultados.innerHTML = htmlContent;
            } else if (json.sucesso && json.dados.length === 0) {
                divResultados.innerHTML = `<p class="placeholder-text">Nenhuma tag relevante encontrada.</p>`;
            } else {
                divResultados.innerHTML = `<p style="color: #ef4444;">Erro da API: ${json.erro}</p>`;
            }
        }

        // Evento do Botão de Análise
        btnAnalisar.addEventListener('click', enviarParaAPI);</script>
</body>

</html>
